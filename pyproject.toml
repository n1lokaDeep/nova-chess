[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-chess"
version = "1.0.0"
description = "Шахматный движок, который играет как человек — и не зевает"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Orion" }]
keywords = ["chess", "ai", "human-like", "engine", "nova", "stockfish"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "chess>=1.10.0",
    "onnxruntime>=1.16.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
web = ["fastapi>=0.110.0", "uvicorn[standard]>=0.29.0"]

[project.scripts]
nova-chess = "nova_chess.cli:main"

[project.urls]
Homepage = "https://github.com/USER/nova-chess"
Source = "https://github.com/USER/nova-chess"

[tool.setuptools.packages.find]
include = ["nova_chess*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Корень репозитория в путях импорта: без этого `pytest tests/`
# не находит пакет nova_chess (python -m pytest добавляет cwd сам,
# а обычный вызов pytest — нет).
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", "__pycache__", ".pytest_cache", "models"]

[tool.ruff.lint]
select = [
    "E",    # ошибки стиля
    "W",    # предупреждения стиля
    "F",    # логические ошибки: неиспользуемое, неопределённое
    "I",    # порядок импортов
    "N",    # именование
    "UP",   # устаревший синтаксис
    "B",    # подозрительные конструкции
    "C4",   # упрощение comprehensions
    "SIM",  # упрощение логики
    "PIE",  # лишние конструкции
    "PYI",  # соглашения аннотаций типов
    "RUF",  # правила самого ruff
    "S",    # безопасность
]

ignore = [
    # Осознанные решения, а не недосмотр:
    "S110",    # try/except/pass при освобождении ресурсов
    "S112",    # try/except/continue при разборе чужих данных
    "BLE001",  # широкий except: сервер не должен падать от одной ошибки
    "S104",    # сервер слушает 127.0.0.1, это не «bind на все интерфейсы»
    # Проект русскоязычный: «неоднозначные» кириллические символы,
    # похожие на латинские, — норма, а не ошибка
    "RUF001",
    "RUF002",
    "RUF003",
    # __enter__ возвращает конкретный класс; typing.Self доступен только
    # с Python 3.11, а проект поддерживает 3.10
    "PYI034",
]

[tool.ruff.lint.per-file-ignores]
# do_POST и do_GET — имена из BaseHTTPRequestHandler, переименовать нельзя
"nova_chess/web/server.py" = ["N802"]
# assert — основной инструмент тестов; словари-константы в классах удобны
"tests/*" = ["S101", "RUF012"]
# print — это и есть вывод примеров и служебных скриптов
"examples/*" = ["T201"]
"scripts/*" = ["T201"]
