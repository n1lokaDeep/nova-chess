name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Тесты
        # Тесты, требующие модель Nova или Stockfish, пропускаются сами:
        # их нет в репозитории. Проверяется вся остальная логика —
        # кодирование позиций, индексация ходов, калибровка, фильтр.
        run: pytest tests/ -v
