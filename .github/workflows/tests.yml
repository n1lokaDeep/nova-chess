name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Полный набор версий Python на Linux
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          # Windows отдельно: интерфейс и запуск сервера рассчитаны
          # в первую очередь на него, стоит убедиться, что не ломается
          - os: windows-latest
            python-version: "3.11"
            coverage: true

    steps:
      - uses: actions/checkout@v7

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Тесты
        # Тесты, требующие модель Nova или Stockfish, пропускаются сами:
        # их нет в репозитории. Проверяется вся остальная логика —
        # кодирование позиций, индексация ходов, калибровка, фильтр.
        run: pytest tests/ -v

      - name: Покрытие
        # Покрытие считается один раз, на Windows-джобе
        if: matrix.coverage
        run: pytest tests/ --cov=nova_chess --cov-report=term-missing --cov-report=xml

      - name: Итог покрытия в сводку
        if: matrix.coverage
        shell: bash
        run: |
          {
            echo "### Покрытие тестами"
            echo ""
            echo '```'
            python -m coverage report --skip-covered || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
